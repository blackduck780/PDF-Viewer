<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tiny AI Command Bot</title>
    <link rel="manifest" href="/manifest.json">
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <div class="container">
        <h1>🔥 Tiny AI Command Bot</h1>
        <div class="dos-warning">🛡️ DoS Protection Active</div>
        
        <input type="file" id="fileInput" accept=".txt">
        <div class="status" id="status">Upload commands.txt first</div>
        
        <textarea id="query" placeholder="Ex: scanning using Nmap on ip 120.0.0.1" rows="3"></textarea>
        <button id="queryBtn" disabled>🎯 Generate Command</button>
        <button id="speakBtn" disabled>🔊 Speak</button>
        
        <div class="loading" id="loading">
            <div class="spinner"></div> AI Processing...
        </div>
        
        <div id="output" class="output">Ready...</div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.2"></script>
    <script src="/app.js"></script>
    <script>
        if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js');
    </script>
</body>
</html>
